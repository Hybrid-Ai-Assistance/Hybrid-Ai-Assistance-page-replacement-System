<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformer Logo Animation</title>
  <style>
    body {
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .logo {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .part {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    /* Animations for each part */
    .part1 { animation: dropIn 1s ease forwards; }
    .part2 { animation: slideInLeft 1s ease forwards 0.3s; }
    .part3 { animation: slideInRight 1s ease forwards 0.6s; }
    .part4 { animation: riseUp 1s ease forwards 0.9s; }
    .part5 { animation: dropIn 1s ease forwards 1.2s; }
    .part6 { animation: slideInLeft 1s ease forwards 1.5s; }
    .part7 { animation: slideInRight 1s ease forwards 1.8s; }
    .part8 { animation: riseUp 1s ease forwards 2.1s; }
        .part9 { animation: dropIn 1s ease forwards 3.1s; }

        
    /* Keyframes */
    @keyframes dropIn {
      from { transform: translateY(-300px) scale(0.5); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes slideInLeft {
      from { transform: translateX(-400px) rotate(-45deg); opacity: 0; }
      to   { transform: translateX(0) rotate(0); opacity: 1; }
    }

    @keyframes slideInRight {
      from { transform: translateX(400px) rotate(45deg); opacity: 0; }
      to   { transform: translateX(0) rotate(0); opacity: 1; }
    }

    @keyframes riseUp {
      from { transform: translateY(300px) scale(0.5); opacity: 0; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="1Forhead.png" class="part part1">
    <img src="2Right.png" class="part part2">
    <img src="3Left.png" class="part part3">
    <img src="4Middle.png" class="part part4">
    <img src="5LLeft.png" class="part part5">
    <img src="6LRight.png" class="part part6">
    <img src="7LMiddle.png" class="part part7">
    <img src="8Lower.png" class="part part8">
    <img src="Eyes.png" class="part part9">
  </div>
</body>
</html>
