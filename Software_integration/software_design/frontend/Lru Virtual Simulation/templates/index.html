<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LRU Page Replacement Simulation with I/O Pause</title>
<style>
  body { font-family: Arial, sans-serif; }
  table { border-collapse: collapse; margin-top: 20px; }
  td, th { border: 1px solid black; padding: 5px; text-align: center; width: 40px; }
  #currentPage { margin-top: 10px; font-weight: bold; font-size: 1.1em; }
  #summary { margin-top: 15px; font-weight: bold; }
  h3 { margin-top: 30px; }
  .fault { background-color: #0fbcd3; } /* red for page fault */
  .hit { background-color: #99ff99; }   /* green for hit */
  .lruOldest { background-color: #ffcc99; } /* highlight pop next */
</style>
<script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
<h2>LRU Page Replacement Simulation</h2>

<label>Frames:</label>
<input id="frames" type="number" value="3"><br><br>
<label>Sequence Length:</label>
<input id="seq" type="number" value="30"><br><br>
<button id="toggleBtn" onclick="toggleSimulation()">Start simulation</button>
<button onclick="startSimulation()">Restart Simulation</button>

<div id="currentPage">Current Page: -</div>

<!-- Page Sequence Table -->
<h3>Page Sequence</h3>
<table id="pageTable"></table>

<!-- LRU Frame Table -->
<h3>LRU Frames (Sliding Window)</h3>
<table id="frameTable"></table>

<!-- LRU Stack Table -->
<h3>LRU Stack (Left = Pop Next, Right = Recently Used)</h3>
<table id="stackTable"></table>

<div id="summary"></div>
</body>
</html>
